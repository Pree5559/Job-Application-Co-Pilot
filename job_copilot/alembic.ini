[alembic]
script_location = alembic

[alembic:runtime]
# default sqlalchemy.url can be overridden in env.py or alembic.ini
sqlalchemy.url = sqlite:///./job_copilot.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
