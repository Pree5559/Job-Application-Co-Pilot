services:
  - type: web
    name: job-copilot
    runtime: python
    plan: free
    rootDir: job_copilot
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_MAX_TOKENS
        value: 800
      - key: GROQ_MAX_RETRIES
        value: 2
      - key: PYTHON_VERSION
        value: 3.11.0
